org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The app itself is a plain Activity and a SurfaceView: no AndroidX, no support library, nothing to
# jetify (android.enableJetifier stays off, its default). This is true for the tests only --
# Robolectric pulls androidx.test:monitor and androidx.test.espresso:espresso-idling-resource into
# the unit-test classpath, and the Android Gradle plugin refuses to resolve them while this is false
# ("contains AndroidX dependencies, but the 'android.useAndroidX' property is not enabled"). The
# flag changes nothing in the APK: no AndroidX library is packaged, since Robolectric is
# testImplementation and never leaves the JVM.
android.useAndroidX=true
android.nonTransitiveRClass=true
